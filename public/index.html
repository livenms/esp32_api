<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Broodinnox Smart Brooding System - Live Monitoring Dashboard"/>
  <title>Broodinnox &middot; Control Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 2C12 2 6 9.5 6 14.5C6 18.09 8.69 21 12 21C15.31 21 18 18.09 18 14.5C18 9.5 12 2 12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 17.5C13.5 17.5 14.5 16.4 14.5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h2>Broodinnox</h2>
          <p class="sub">Brooding Control System</p>
        </div>
      </div>

      <nav>
        <button class="nav-btn active" data-page="dashboard" onclick="setPage('dashboard', this)">
          <span class="nav-icon">◱</span> Dashboard
        </button>
        <button class="nav-btn" data-page="sensors" onclick="setPage('sensors', this)">
          <span class="nav-icon">◈</span> Sensors
        </button>
        <button class="nav-btn" data-page="control" onclick="setPage('control', this)">
          <span class="nav-icon">◉</span> Control
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <!-- CONNECTION STATUS -->
      <div class="status-box">
        <p class="status-box-title">Link Status</p>
        <div class="status-row">
          <span class="status-led" id="brokerLed"></span>
          <span class="status-row-label">Broker</span>
          <span class="status-row-value" id="mqttStatus">Disconnected</span>
        </div>
        <div class="status-row">
          <span class="status-led" id="deviceLed"></span>
          <span class="status-row-label">Device</span>
          <span class="status-row-value" id="deviceStatusSidebar">Unknown</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-row">
          <span class="status-row-label">ID</span>
          <span class="status-row-value mono" id="deviceId">BROODIINNOX-001</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <header>
        <div>
          <p class="header-eyebrow" id="pageEyebrow">Live monitoring</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="header-clock" id="headerClock">--:--:--</div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="dashboard.js"></script>
  <script src="App.js"></script>
</body>
</html>
